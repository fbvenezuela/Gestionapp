<!doctype html>
<html lang="es-VE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin señal</title>
<style>
  body { font-family: system-ui, sans-serif; background: #F7F7F5; color: #111; margin: 0; display: grid; place-items: center; min-height: 100vh; padding: 16px; }
  main { max-width: 360px; background: #fff; border: 1px solid #E9E8E4; border-radius: 12px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 15px; line-height: 1.5; color: #444; }
  button { min-height: 48px; width: 100%; border: 0; border-radius: 8px; background: #7F8630; color: #111; font-weight: 600; font-size: 16px; }
</style>
</head>
<body>
<main>
  <h1>No hay señal</h1>
  <p>Lo que estabas escribiendo quedó guardado en el teléfono. Cuando vuelva la señal, toca el botón.</p>
  <button onclick="location.reload()">Volver a intentar</button>
</main>
</body>
</html>
