# Servicios auxiliares para trabajar en local (D-94). La app NO los necesita para arrancar: sin nada, corre en modo
# demostración (PGlite); con LOCAL_DATA_DIR, la demo guarda sus datos en disco. Esto es solo para lo que pide un
# servicio de verdad. No se ejecutó en el entorno donde se escribió (no había Docker): pruébalo antes de confiar en él.
#
#   docker compose up -d postgres   → TEST_DATABASE_URL=postgres://postgres:postgres@localhost:54329/postgres npm run test:rls
#                                     (una base DESECHABLE para las pruebas de RLS; nunca producción)
#   docker compose up -d clamav     → ATTACHMENT_SCANNER=clamav CLAMAV_HOST=127.0.0.1 CLAMAV_PORT=3310
#                                     (el revisor de los archivos de la atención ciudadana; tarda unos minutos en
#                                     bajar sus firmas la primera vez)
#
# El correo no necesita servicio (EMAIL_MODE=outbox: todo queda en la tabla outbox) y el almacenamiento local es una
# carpeta (src/lib/storage/local-files.ts): por eso aquí no hay Mailpit ni MinIO.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - '54329:5432'
  clamav:
    image: clamav/clamav:stable
    ports:
      - '3310:3310'
