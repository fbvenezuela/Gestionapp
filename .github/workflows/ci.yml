name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app-freddy-bernal

jobs:
  checks:
    name: Lint, tipos, pruebas y RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-freddy-bernal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Pruebas unitarias y de RLS (Postgres en memoria)
        run: npm test
      - name: Migraciones y RLS en Postgres 16
        run: npm run test:rls
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  build-e2e:
    name: Build y pruebas en celular (360 px)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-freddy-bernal/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app-freddy-bernal/playwright-report
          retention-days: 7

  secrets:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
